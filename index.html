<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinus Technologies - Akıllı Asistan</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #cbd5e1; /* Gün 36: Önceki soluk tona göre çok daha belirgin kontrast arka plan */
            color: #1e293b;      /* Yüksek okunabilirlik için koyu metin rengi */
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .chat-container { 
            width: 750px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 80vh; 
        }
        .chat-header { 
            background: #0284c7; /* Daha modern bir mavi tonu */
            color: white; 
            padding: 18px; 
            text-align: center; 
            font-size: 1.1rem;
            font-weight: bold; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .chat-messages { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 8px; 
            max-width: 80%; 
            line-height: 1.5; 
            font-size: 0.95rem;
        }
        .user-message { 
            background: #0284c7; 
            color: white; 
            align-self: flex-end; 
        }
        .bot-message { 
            background: #f1f5f9; /* Gün 36: Kontrastı artırılmış, hemen fark edilen bot mesaj kutusu */
            color: #0f172a;      /* Net okunabilirlik için koyu metin */
            border: 1px solid #e2e8f0;
            align-self: flex-start; 
        }
        .feedback-buttons {
            margin-top: 8px;
            display: flex;
            gap: 8px;
        }
        .feedback-buttons button {
            background: none;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            cursor: pointer;
            padding: 2px 6px;
            font-size: 0.9rem;
        }
        .feedback-buttons button:hover {
            background: #e2e8f0;
        }
        .chat-input-area { 
            border-top: 1px solid #cbd5e1; 
            padding: 15px; 
            background: #fff; 
            display: flex; 
            gap: 12px; 
        }
        .chat-input-area input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            outline: none; 
            font-size: 1rem;
        }
        .chat-input-area button { 
            padding: 12px 20px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem;
            font-weight: bold;
        }
        .chat-input-area button:hover { 
            background: #0369a1; 
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        Tinus Technologies Destek Asistanı
    </div>
    <div id="chatMessages" class="chat-messages">
        <div class="message bot-message">Merhaba! Tinus Technologies hakkında size nasıl yardımcı olabilirim?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Sorunuzu yazın (örn: FEA nedir?)..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    const sessionId = Math.random().toString(36).substring(2, 15);

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const query = inputField.value.trim();
        if (!query) return;

        const messagesContainer = document.getElementById("chatMessages");

        messagesContainer.innerHTML += `<div class="message user-message">${query}</div>`;
        inputField.value = "";
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        const loadingId = "loading-" + Date.now();
        messagesContainer.innerHTML += `<div id="${loadingId}" class="message bot-message" style="opacity: 0.6; font-style: italic;">Asistan düşünüyor...</div>`;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            const response = await fetch("/api/v1/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId, query: query })
            });

            const data = await response.json();

            document.getElementById(loadingId).remove();

            const botMessageHTML = `
                <div class="message bot-message">
                    ${data.answer}
                    <div class="feedback-buttons">
                        <button onclick="sendFeedback(true, this)" title="Beğen">👍</button>
                        <button onclick="sendFeedback(false, this)" title="Beğenme">👎</button>
                    </div>
                </div>
            `;
            messagesContainer.innerHTML += botMessageHTML;
        } catch (error) {
            document.getElementById(loadingId).remove();
            messagesContainer.innerHTML += `<div class="message bot-message">Bağlantı hatası oluştu, lütfen tekrar deneyin.</div>`;
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendFeedback(isLiked, buttonElement) {
        const feedbackText = isLiked ? "Kullanıcı bu mesajı beğendi 👍" : "Kullanıcı bu mesajı beğenmedi 👎";
        console.log(feedbackText);

        const parentDiv = buttonElement.parentElement;
        parentDiv.innerHTML = isLiked ? "<span>Teşekkürler! 👍</span>" : "<span>Geri bildiriminiz alındı. 👎</span>";

        try {
            await fetch('/api/v1/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ liked: isLiked, message: feedbackText })
            });
        } catch (error) {
            console.error("Geri bildirim gönderilemedi:", error);
        }
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
