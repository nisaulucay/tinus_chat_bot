<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tinus Technologies - Akıllı Asistan</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f4f7f6; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .chat-container { 
            width: 750px; 
            background: white; 
            border-radius: 12px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.12); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 80vh; 
        }
        .chat-header { 
            background: #007bff; 
            color: white; 
            padding: 18px; 
            text-align: center; 
            font-size: 1.1rem;
            font-weight: bold; 
        }
        .chat-messages { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .message { 
            padding: 12px 16px; 
            border-radius: 8px; 
            max-width: 80%; 
            line-height: 1.5; 
            font-size: 0.95rem;
        }
        .user-message { 
            background: #007bff; 
            color: white; 
            align-self: flex-end; 
        }
        .bot-message { 
            background: #e9ecef; 
            color: #333; 
            align-self: flex-start; 
        }
        .chat-input-area { 
            border-top: 1px solid #ddd; 
            padding: 15px; 
            background: #fff; 
            display: flex; 
            gap: 12px; 
        }
        .chat-input-area input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            outline: none; 
            font-size: 1rem;
        }
        .chat-input-area button { 
            padding: 12px 20px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 1rem;
            font-weight: bold;
        }
        .chat-input-area button:hover { 
            background: #0056b3; 
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Tinus Technologies Destek Asistanı</div>
    <div id="chatMessages" class="chat-messages">
        <div class="message bot-message">Merhaba! Tinus Technologies hakkında size nasıl yardımcı olabilirim?</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="userInput" placeholder="Sorunuzu yazın (örn: FEA nedir?)..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gönder</button>
    </div>
</div>

<script>
    // Sayfa yüklendiğinde benzersiz bir oturum kimliği (session_id) oluştur.
    const sessionId = Math.random().toString(36).substring(2, 15);

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const query = inputField.value.trim();
        if (!query) return;

        const messagesContainer = document.getElementById("chatMessages");

        // Kullanıcı mesajını ekrana ekle
        messagesContainer.innerHTML += `<div class="message user-message">${query}</div>`;
        inputField.value = "";
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        // Geçici "Düşünüyor..." göstergesi
        const loadingId = "loading-" + Date.now();
        messagesContainer.innerHTML += `<div id="${loadingId}" class="message bot-message" style="opacity: 0.6; font-style: italic;">Asistan düşünüyor...</div>`;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        try {
            // FastAPI backend'e istek atma (session_id eklendi)
            const response = await fetch("/api/v1/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId, query: query })
            });

            const data = await response.json();

            // "Düşünüyor..." yazısını kaldır
            document.getElementById(loadingId).remove();

            // Bot yanıtını ekrana ekle
            messagesContainer.innerHTML += `<div class="message bot-message">${data.answer}</div>`;
        } catch (error) {
            document.getElementById(loadingId).remove();
            messagesContainer.innerHTML += `<div class="message bot-message">Bağlantı hatası oluştu, lütfen tekrar deneyin.</div>`;
        }
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
